<div class="bg-bgLightDarker dark:bg-bgDarkDarker min-h-screen overflow-x-clip">
  <!-- Sidebar desktop -->
  <aside
    class="lg:bg-bgDark/95 hidden lg:fixed lg:inset-y-0 lg:left-0 lg:z-50 lg:flex lg:w-64 lg:flex-col lg:border-r lg:border-white/5 lg:backdrop-blur-md"
  >
    <div class="flex h-16 shrink-0 items-center px-5">
      <a
        routerLink=""
        class="text-primaryDarker dark:text-primaryDark flex items-center text-xl font-bold"
      >
        <img
          class="h-8 w-8"
          src="assets/img/gameon-logo.webp"
          alt="GameOn!'s logo"
        />
        <span class="ml-2">GameOn!</span>
      </a>
    </div>

    <nav class="flex flex-1 flex-col gap-1 overflow-y-auto px-3 py-4">
      <a
        routerLink=""
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="!text-white bg-white/10"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-gray-400 transition-colors hover:bg-white/5 hover:text-white"
      >
        <fa-icon
          [icon]="homeIcon"
          class="w-5 shrink-0 text-center text-base"
        ></fa-icon>
        <span class="text-sm font-medium">Accueil</span>
      </a>
      <a
        routerLink="/fifa"
        routerLinkActive="!text-white bg-white/10"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-gray-400 transition-colors hover:bg-white/5 hover:text-white"
      >
        <fa-icon
          [icon]="ballIcon"
          class="w-5 shrink-0 text-center text-base"
        ></fa-icon>
        <span class="text-sm font-medium">FIFA</span>
      </a>
      <a
        routerLink="/lol"
        routerLinkActive="!text-white bg-white/10"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-gray-400 transition-colors hover:bg-white/5 hover:text-white"
      >
        <img
          src="assets/img/svg/lol.svg"
          class="h-5 w-5 shrink-0 object-contain"
          alt="League of Legends"
        />
        <span class="text-sm font-medium">League of Legends</span>
      </a>
      <a
        routerLink="/fifa/tournaments"
        routerLinkActive="!text-white bg-white/10"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-gray-400 transition-colors hover:bg-white/5 hover:text-white"
      >
        <fa-icon
          [icon]="trophyIcon"
          class="w-5 shrink-0 text-center text-base"
        ></fa-icon>
        <span class="text-sm font-medium">Tournois</span>
      </a>
      <a
        routerLink="/changelog"
        routerLinkActive="!text-white bg-white/10"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-gray-400 transition-colors hover:bg-white/5 hover:text-white"
      >
        <fa-icon
          [icon]="changelogIcon"
          class="w-5 shrink-0 text-center text-base"
        ></fa-icon>
        <span class="text-sm font-medium">Changelog</span>
      </a>
    </nav>

    <div class="shrink-0 border-t border-white/5 px-3 pb-4 pt-3">
      @if (isLoggedIn) {
        <a
          routerLink="/player/me"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-gray-400 transition-colors hover:bg-white/5 hover:text-white"
        >
          <div
            class="bg-primary/30 text-primaryDark flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-sm font-bold"
          >
            {{ (player$ | async)?.nickname?.charAt(0)?.toUpperCase() }}
          </div>
          <div class="min-w-0">
            <p class="truncate text-sm font-medium text-white">
              {{ (player$ | async)?.nickname }}
            </p>
            <p class="text-xs text-gray-500">Mon profil</p>
          </div>
        </a>
      } @else {
        <button
          (click)="login()"
          class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-gray-400 transition-colors hover:bg-white/5 hover:text-white"
        >
          <fa-icon
            [icon]="userIcon"
            class="w-5 shrink-0 text-center text-base"
          ></fa-icon>
          <span class="text-sm font-medium">Se connecter</span>
        </button>
      }
    </div>
  </aside>

  <div class="background min-h-screen overflow-x-clip lg:pl-64">
    <!-- Header mobile uniquement -->
    <header
      class="bg-bgLight/40 dark:bg-bgDark/40 backdrop-blur-xs sticky top-0 z-50 flex h-16 items-center justify-between px-6 py-0 backdrop-contrast-100 backdrop-saturate-100 backdrop-filter lg:hidden"
    >
      <a
        routerLink=""
        class="text-primaryDarker dark:text-primaryDark flex h-full items-center gap-2 text-xl font-bold"
        ><img
          class="h-8 w-8"
          src="assets/img/gameon-logo.webp"
          alt="GameOn!'s logo"
        />
        <span>GameOn!</span></a
      >

      <div class="flex h-full items-center gap-4">
        <a
          href="https://halterodata.valentinvirot.fr"
          target="_blank"
          rel="noopener noreferrer"
          class="cursor-pointer text-gray-600 opacity-75 transition-all hover:text-gray-700 hover:opacity-100 dark:text-gray-400 dark:hover:text-gray-300"
          title="Haltérodata"
        >
          <fa-icon [icon]="dumbbellIcon" class="text-lg"></fa-icon>
        </a>
      </div>
    </header>

    <div class="bubble-layer" aria-hidden="true">
      <span class="bubble"></span>
      <span class="bubble"></span>
      <span class="bubble"></span>
      <span class="bubble"></span>
      <span class="bubble"></span>
      <span class="bubble"></span>
      <span class="bubble"></span>
      <span class="bubble"></span>
      <span class="bubble"></span>
      <span class="bubble"></span>
      <span class="bubble"></span>
      <span class="bubble"></span>
      <span class="bubble"></span>
      <span class="bubble"></span>
    </div>

    <!-- Nav flottante mobile uniquement -->
    <nav
      class="border-l-frenchBlue border-r-frenchRed bg-bgLight/50 dark:border-y-bgLight dark:bg-bgDark/50 fixed bottom-4 left-1/2 z-50 h-16 w-11/12 max-w-lg -translate-x-1/2 rounded-full border border-l-2 border-r-2 border-b-gray-300 border-t-gray-300 backdrop-blur-sm backdrop-contrast-100 backdrop-saturate-100 backdrop-filter lg:hidden"
    >
      <div
        class="flex h-full w-full grow basis-1 items-center justify-around align-middle"
      >
        <div
          routerLink=""
          class="group inline-flex cursor-pointer flex-col items-center justify-center rounded-s-full"
        >
          <fa-icon
            [icon]="homeIcon"
            class="text-primary dark:text-primaryDark text-lg"
          ></fa-icon>
        </div>

        <div
          routerLink="/fifa"
          class="group inline-flex cursor-pointer flex-col items-center justify-center rounded-s-full"
        >
          <fa-icon
            [icon]="ballIcon"
            class="text-primary dark:text-primaryDark text-lg"
          ></fa-icon>
        </div>

        <div
          class="group inline-flex cursor-pointer flex-col items-center justify-center rounded-s-full"
        >
          <img
            src="assets/img/svg/lol.svg"
            routerLink="/lol"
            class="w-10 min-w-10"
          />
        </div>

        <div
          class="group inline-flex cursor-pointer flex-col items-center justify-center rounded-s-full"
        >
          <button
            routerLink="/fifa/tournaments"
            type="button"
            class="cursor-pointer"
          >
            <fa-icon
              [icon]="trophyIcon"
              class="text-primary dark:text-primaryDark text-lg"
            ></fa-icon>
          </button>
        </div>

        <div
          class="group inline-flex cursor-pointer flex-col items-center justify-center rounded-s-full"
        >
          @if (isLoggedIn == true) {
            <button
              routerLink="/player/me"
              type="button"
              class="group inline-flex cursor-pointer flex-col items-center justify-center rounded-e-full"
            >
              <fa-icon
                [icon]="userIcon"
                class="text-primary dark:text-primaryDark text-lg"
              ></fa-icon>
            </button>
          }

          @if (isLoggedIn == false) {
            <button
              (click)="login()"
              type="button"
              class="group inline-flex cursor-pointer flex-col items-center justify-center rounded-e-full"
            >
              <fa-icon
                [icon]="userIcon"
                class="text-primary dark:text-primaryDark text-lg"
              ></fa-icon>
            </button>
          }
        </div>
      </div>
    </nav>

    <div class="px-0 pb-28 pt-0 md:px-16 lg:px-8 lg:pb-8 xl:px-12 2xl:px-16">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
