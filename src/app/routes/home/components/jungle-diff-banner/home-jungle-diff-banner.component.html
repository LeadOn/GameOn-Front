<div
  class="jungle-diff-banner animate-fade relative flex min-h-45 flex-col justify-between gap-4 overflow-hidden rounded-xl p-7 text-white shadow-xl sm:flex-row sm:items-center"
>
  <div class="flex items-center gap-4">
    <img
      src="assets/img/svg/lol.svg"
      class="h-12 w-12 shrink-0 object-contain drop-shadow-md"
      alt="League of Legends"
    />
    <div>
      <span
        class="bg-customGreen inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold tracking-wide uppercase shadow"
      >
        Déménagement
      </span>
      <h2 class="mt-2 text-2xl font-bold drop-shadow-md md:text-3xl">
        League of Legends a déménagé !
      </h2>
      <p class="mt-1.5 text-sm text-white/80 drop-shadow-sm">
        Statistiques, classements et historique de parties sont désormais
        disponibles sur JungleDiff.
      </p>
    </div>
  </div>

  <a
    [href]="jungleDiffUrl"
    target="_blank"
    rel="noopener noreferrer"
    class="bg-customGreen hover:bg-customGreen/90 shrink-0 self-start rounded-lg px-4 py-2 text-center text-sm font-semibold text-white shadow-md transition-colors sm:self-center"
  >
    Aller sur JungleDiff →
  </a>
</div>
