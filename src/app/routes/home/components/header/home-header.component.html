<div class="animate-fade flex items-start justify-between gap-3">
  <div class="min-w-0">
    <p class="text-sm text-gray-500 capitalize dark:text-gray-400">
      {{ today | date: 'EEEE d MMMM' }}
    </p>
    <h1 class="text-primary dark:text-primaryDark text-3xl font-bold">
      @if (isLoggedIn == true && (player$ | async); as player) {
        Salut, {{ player.nickname }}
      } @else {
        Bienvenue sur GameOn !
      }
    </h1>
  </div>

  @if (season != null) {
    <div class="mt-6 shrink-0">
      <app-pill
        [title]="season.name"
        [icon]="seasonIcon"
        [iconColor]="'text-primary dark:text-primaryDark'"
        [bgStyle]="'primary-dark'"
        [borderStyle]="'primary'"
      ></app-pill>
    </div>
  }
</div>
