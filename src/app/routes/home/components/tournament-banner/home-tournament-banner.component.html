@if (tournament != null) {
  <div
    class="tournament-banner animate-fade relative flex min-h-[220px] cursor-pointer flex-col justify-between rounded-lg p-6 text-white drop-shadow-lg"
    routerLink="/fifa/tournaments/{{ tournament.id }}"
  >
    <div>
      <span
        class="bg-frenchRed inline-flex items-center gap-1 rounded-full px-2 py-1 text-xs font-semibold uppercase"
      >
        <span class="h-1.5 w-1.5 rounded-full bg-white"></span>
        Tournoi en cours
      </span>

      <h2 class="mt-3 text-3xl font-bold">{{ tournament.name }}</h2>
      <!-- Placeholder : "Phase de groupes" et "prochain match ce soir" sont en dur, le modèle Tournament ne porte pas ces infos. -->
      <p class="mt-1 text-sm text-white/70">
        Phase de groupes · {{ tournament.players.length }} joueurs ·
        prochain match ce soir
      </p>
    </div>

    <div class="mt-4 flex gap-2">
      <button
        class="bg-customGreen rounded-lg px-4 py-2 text-sm font-semibold text-white"
        (click)="$event.stopPropagation()"
        routerLink="/fifa/tournaments/{{ tournament.id }}"
      >
        Voir le tournoi →
      </button>
      <!-- Placeholder : pas de vue "classement" dédiée, pointe pour l'instant sur la même page tournoi. -->
      <button
        class="rounded-lg bg-white/10 px-4 py-2 text-sm font-semibold text-white backdrop-blur-sm"
        (click)="$event.stopPropagation()"
        routerLink="/fifa/tournaments/{{ tournament.id }}"
      >
        Classement
      </button>
    </div>
  </div>
}
