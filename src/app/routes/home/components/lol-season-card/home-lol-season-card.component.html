<div
  class="animate-fade bg-bgLight/40 dark:bg-bgDark/40 flex h-full flex-col justify-between rounded-lg p-4 backdrop-blur-sm"
>
  <div class="flex items-center justify-between">
    <span class="text-primary dark:text-primaryDark text-lg font-semibold"
      >Ma saison LoL</span
    >
    <fa-icon [icon]="rankIcon" class="text-secondary"></fa-icon>
  </div>

  <div class="mt-4 flex items-center gap-3">
    <div
      class="from-secondary flex h-16 w-16 items-center justify-center rounded-full bg-gradient-to-br to-purple-500"
    >
      <fa-icon [icon]="rankIcon" class="text-2xl text-white"></fa-icon>
    </div>
    <div>
      <p class="text-primary dark:text-primaryDark text-xl font-bold">
        {{ tier }}
      </p>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        {{ lp }} LP · {{ queueType }}
      </p>
    </div>
  </div>
</div>
