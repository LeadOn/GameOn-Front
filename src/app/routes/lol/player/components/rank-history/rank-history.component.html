<div class="chart-container mt-2">
  <canvas #rankHistoryChart id="rank-history-chart"></canvas>
</div>

@if (queueSummaries.length > 0) {
  <div class="mt-3 space-y-1.5">
    @for (summary of queueSummaries; track summary.label) {
      <div
        class="flex flex-wrap items-center justify-between gap-x-2 gap-y-0.5 text-xs"
      >
        <span class="flex items-center gap-1.5 text-gray-500 dark:text-gray-400">
          <span
            class="h-1.5 w-1.5 shrink-0 rounded-full"
            [style.background-color]="summary.color"
          ></span>
          {{ tierLabel(summary.oldest) }} &middot;
          {{ formatRelativeDate(summary.oldest.createdOn) }}
        </span>
        <span class="font-medium" [style.color]="summary.color">
          {{ tierLabel(summary.newest) }} &middot;
          {{ summary.newest.leaguePoints }} LP aujourd'hui
        </span>
      </div>
    }
  </div>
}
