<div
  class="border-mpBorder flex flex-wrap items-center justify-between gap-3 border-b px-5 py-4"
>
  <div>
    <p class="font-heading text-mpText text-base font-semibold">
      {{
        mode == "team" ? "Écart d'or entre équipes" : "Or du joueur sélectionné"
      }}
    </p>
    <p class="text-mpTextMuted mt-0.5 text-[13px]">
      En fin de partie : {{ centerLabel }}
    </p>
  </div>

  <div
    class="border-mpBorder inline-flex items-center gap-1 rounded-full border p-1"
  >
    <button
      type="button"
      class="rounded-full px-3 py-1.5 text-xs font-semibold transition-colors"
      [ngClass]="
        mode == 'team'
          ? 'text-mpText bg-white/10 light:bg-[rgba(23,30,54,0.08)]'
          : 'text-mpTextMuted hover:text-mpText'
      "
      (click)="setMode('team')"
    >
      Écart d'équipes
    </button>
    <button
      type="button"
      class="rounded-full px-3 py-1.5 text-xs font-semibold transition-colors"
      [ngClass]="
        mode == 'player'
          ? 'text-mpText bg-white/10 light:bg-[rgba(23,30,54,0.08)]'
          : 'text-mpTextMuted hover:text-mpText'
      "
      (click)="setMode('player')"
    >
      Joueur sélectionné
    </button>
  </div>
</div>

<div class="p-5">
  <div class="relative">
    @if (hoverIndex != null) {
      <div
        class="border-mpBorder bg-mpBg pointer-events-none absolute top-0 z-10 -translate-x-1/2 whitespace-nowrap rounded-lg border px-2.5 py-1.5 text-xs shadow-lg"
        [style.left.%]="hoverPercent"
      >
        <p class="text-mpTextMuted">{{ hoverTimeLabel }}</p>
        <p class="text-mpText font-semibold">{{ hoverValueLabel }}</p>
      </div>
    }

    <svg
      [attr.viewBox]="'0 0 ' + width + ' ' + height"
      preserveAspectRatio="none"
      class="h-56 w-full cursor-crosshair"
      (mousemove)="onChartMouseMove($event)"
      (mouseleave)="onChartMouseLeave()"
    >
    @if (mode == "team") {
      <line
        x1="0"
        [attr.y1]="midY"
        [attr.x2]="width"
        [attr.y2]="midY"
        class="stroke-[rgba(255,255,255,0.12)] light:stroke-[rgba(23,30,54,0.14)]"
        stroke-width="1"
      />
      <clipPath id="gold-clip-above">
        <rect x="0" y="0" [attr.width]="width" [attr.height]="midY" />
      </clipPath>
      <clipPath id="gold-clip-below">
        <rect
          x="0"
          [attr.y]="midY"
          [attr.width]="width"
          [attr.height]="height - midY"
        />
      </clipPath>
      <path
        [attr.d]="areaPath"
        fill="rgba(45,224,165,0.35)"
        clip-path="url(#gold-clip-above)"
      />
      <path
        [attr.d]="areaPath"
        fill="rgba(255,92,116,0.35)"
        clip-path="url(#gold-clip-below)"
      />
      <path
        [attr.d]="linePath"
        fill="none"
        class="stroke-[rgba(237,240,250,0.6)] light:stroke-[rgba(35,42,64,0.7)]"
        stroke-width="2"
      />
    } @else {
      <path [attr.d]="areaPath" fill="rgba(240,190,78,0.35)" />
      <path
        [attr.d]="linePath"
        fill="none"
        class="stroke-mpYellowInk"
        stroke-width="2"
      />
    }

    @if (frames.length > 1) {
      <line
        [attr.x1]="playheadX"
        [attr.x2]="playheadX"
        y1="0"
        [attr.y2]="height"
        class="stroke-[rgba(255,255,255,0.45)] light:stroke-[rgba(23,30,54,0.5)]"
        stroke-width="1.5"
        stroke-dasharray="4 4"
      />
    }

    @if (hoverIndex != null) {
      <line
        [attr.x1]="hoverX"
        [attr.x2]="hoverX"
        y1="0"
        [attr.y2]="height"
        class="stroke-mpYellowInk"
        stroke-width="1"
      />
      <circle
        [attr.cx]="hoverX"
        [attr.cy]="hoverY"
        r="4"
        class="fill-mpYellowInk"
      />
    }
  </svg>
  </div>

  <div class="text-mpTextMuted mt-1 flex items-center justify-between text-xs">
    <span>{{ startLabel }}</span>
    <span class="text-mpTextSecondary font-medium">{{ centerLabel }}</span>
    <span>{{ endLabel }}</span>
  </div>
</div>
