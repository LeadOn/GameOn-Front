<div class="p-5">
  @if (mode == "dealt") {
    <div
      class="text-mpTextMuted mb-3 flex items-center justify-end gap-4 text-xs"
    >
      <span class="flex items-center gap-1.5">
        <span class="bg-mpYellow h-2 w-2 rounded-full"></span>
        Physique
      </span>
      <span class="flex items-center gap-1.5">
        <span class="bg-mpBlue h-2 w-2 rounded-full"></span>
        Magique
      </span>
      <span class="flex items-center gap-1.5">
        <span class="bg-mpText h-2 w-2 rounded-full"></span>
        Brut
      </span>
    </div>
  }

  <div class="space-y-2.5">
    @for (row of rows; track row.player.puuid) {
      <div
        class="flex cursor-pointer items-center gap-3 rounded-lg p-1.5 transition-colors"
        [ngClass]="
          selectedPuuid == row.player.puuid
            ? 'bg-white/10 light:bg-[rgba(23,30,54,0.06)]'
            : 'hover:bg-white/5 light:hover:bg-[rgba(23,30,54,0.04)]'
        "
        (click)="select(row.player)"
      >
        <div class="flex w-36 min-w-0 shrink-0 items-center gap-2">
          <span
            class="h-2 w-2 shrink-0 rounded-full"
            [ngClass]="row.player.teamId == 100 ? 'bg-mpGreen' : 'bg-mpRed'"
          ></span>
          <img
            [src]="championIconUrl(row.player)"
            class="h-6 w-6 shrink-0 rounded-full border border-white/20 object-cover"
          />
          <span class="text-mpText truncate text-xs font-medium">
            {{ row.player.riotIdGameName }}
          </span>
        </div>

        <div
          class="light:bg-[rgba(23,30,54,0.06)] h-4 flex-1 overflow-hidden rounded-full bg-white/5"
        >
          @if (mode == "dealt") {
            <div
              class="flex h-full overflow-hidden rounded-full transition-all duration-500"
              [style.width.%]="widthPercent(row.total)"
            >
              <div
                class="bg-mpYellow h-full"
                [style.width.%]="segmentPercent(row.physical, row.total)"
              ></div>
              <div
                class="bg-mpBlue h-full"
                [style.width.%]="segmentPercent(row.magic, row.total)"
              ></div>
              <div
                class="bg-mpText h-full"
                [style.width.%]="segmentPercent(row.trueDamage, row.total)"
              ></div>
            </div>
          } @else {
            <div
              class="bg-mpRed h-full rounded-full transition-all duration-500"
              [style.width.%]="widthPercent(row.taken)"
            ></div>
          }
        </div>

        <span
          class="text-mpTextSecondary w-16 shrink-0 text-right text-xs font-semibold"
        >
          {{ (mode == "dealt" ? row.total : row.taken) | number: "1.0-0" }}
        </span>
      </div>
    }
  </div>
</div>
