<div class="border-mpBorder border-b px-5 py-4">
  <p class="font-heading text-mpText text-base font-semibold">Or cumulé</p>
  <p class="text-mpTextMuted mt-0.5 truncate text-[13px]">
    {{ playerLabel }} — {{ finalGoldLabel }} or en fin de partie
  </p>
</div>

<div class="p-5">
  @if (linePath) {
    <div class="relative">
      @if (hoverIndex != null) {
        <div
          class="border-mpBorder bg-mpBg pointer-events-none absolute top-0 z-10 -translate-x-1/2 whitespace-nowrap rounded-lg border px-2.5 py-1.5 text-xs shadow-lg"
          [style.left.%]="hoverPercent"
        >
          <p class="text-mpTextMuted">{{ hoverTimeLabel }}</p>
          <p class="text-mpText font-semibold">{{ hoverValueLabel }}</p>
        </div>
      }

      <svg
        [attr.viewBox]="'0 0 ' + width + ' ' + height"
        preserveAspectRatio="none"
        class="h-56 w-full cursor-crosshair"
        (mousemove)="onChartMouseMove($event)"
        (mouseleave)="onChartMouseLeave()"
      >
        <path [attr.d]="areaPath" fill="rgba(240,190,78,0.22)" />
        <path
          [attr.d]="linePath"
          fill="none"
          class="stroke-mpYellowInk"
          stroke-width="2"
        />

        @if (hoverIndex != null) {
          <line
            [attr.x1]="hoverX"
            [attr.x2]="hoverX"
            y1="0"
            [attr.y2]="height"
            class="stroke-mpYellowInk"
            stroke-width="1"
          />
          <circle
            [attr.cx]="hoverX"
            [attr.cy]="hoverY"
            r="4"
            class="fill-mpYellowInk"
          />
        }
      </svg>
    </div>
  } @else {
    <p class="text-mpTextMuted py-16 text-center text-sm">
      Timeline indisponible pour cette partie.
    </p>
  }

  <div class="text-mpTextMuted mt-1 flex items-center justify-between text-xs">
    <span>00:00</span>
    <span>{{ endLabel }}</span>
  </div>
</div>
