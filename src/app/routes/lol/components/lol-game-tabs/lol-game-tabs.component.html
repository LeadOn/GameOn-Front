<div
  class="border-mpBorder inline-flex max-w-full items-center gap-1 overflow-x-auto rounded-full border p-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
  role="tablist"
>
  @for (tab of tabs; track tab.id) {
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="tab.id == activeId"
      class="flex shrink-0 items-center gap-2 whitespace-nowrap rounded-full px-4 py-2 text-sm font-semibold transition-colors"
      [ngClass]="
        tab.id == activeId
          ? 'text-mpText light:bg-[rgba(23,30,54,0.08)] bg-white/10'
          : 'text-mpTextMuted hover:text-mpText'
      "
      (click)="onSelect(tab)"
    >
      <fa-icon [icon]="tab.icon"></fa-icon>
      {{ tab.label }}
    </button>
  }
</div>
