<section id="admin-player-edit" class="px-4 pt-4">
  @if (loading == true) {
    <app-loading-spinner></app-loading-spinner>
  }

  @if (loading == false && player.id != 0) {
    <div class="mb-4">
      <h1 class="text-primary dark:text-primaryDark text-xl font-bold">
        Joueur #{{ player.id }}
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Modifier le profil du joueur.
      </p>
    </div>

    <form [formGroup]="updatePlayerForm" class="flex flex-col items-center">
      <div
        class="bg-bgLight dark:bg-bgDark w-full max-w-xl rounded-2xl p-6 shadow-sm"
        >
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div class="flex flex-col gap-1 sm:col-span-2">
            <label
              for="fullName"
              class="text-xs font-medium text-gray-500 dark:text-gray-400"
              >Nom complet <span class="text-customRed">*</span></label
              >
            <input
              type="text"
              id="fullName"
              formControlName="fullName"
              maxlength="100"
              class="bg-bgLightDarker dark:bg-bgDarkDarker text-primary dark:text-primaryDark focus:ring-secondary rounded-lg border-0 px-3 py-2 text-sm focus:ring-2"
              />
          </div>

          <div class="flex flex-col gap-1">
            <label
              for="nickname"
              class="text-xs font-medium text-gray-500 dark:text-gray-400"
              >Pseudo <span class="text-customRed">*</span></label
              >
            <input
              type="text"
              id="nickname"
              formControlName="nickname"
              maxlength="50"
              class="bg-bgLightDarker dark:bg-bgDarkDarker text-primary dark:text-primaryDark focus:ring-secondary rounded-lg border-0 px-3 py-2 text-sm focus:ring-2"
              />
          </div>

          <div class="flex flex-col gap-1">
            <label
              for="keycloakId"
              class="text-xs font-medium text-gray-500 dark:text-gray-400"
              >Keycloak ID</label
              >
            <input
              type="text"
              id="keycloakId"
              formControlName="keycloakId"
              maxlength="50"
              class="bg-bgLightDarker dark:bg-bgDarkDarker text-primary dark:text-primaryDark focus:ring-secondary rounded-lg border-0 px-3 py-2 text-sm focus:ring-2"
              />
          </div>

          <div class="flex flex-col gap-1 sm:col-span-2">
            <label
              for="profilePicUrl"
              class="text-xs font-medium text-gray-500 dark:text-gray-400"
              >URL de photo de profil
              <span class="text-customRed">*</span></label
              >
            <input
              type="text"
              id="profilePicUrl"
              formControlName="profilePicUrl"
              maxlength="500"
              class="bg-bgLightDarker dark:bg-bgDarkDarker text-primary dark:text-primaryDark focus:ring-secondary rounded-lg border-0 px-3 py-2 text-sm focus:ring-2"
              />
          </div>

          <div class="flex flex-col gap-1 sm:col-span-2">
            <label
              for="archived"
              class="inline-flex cursor-pointer items-center gap-2"
              >
              <input
                type="checkbox"
                id="archived"
                formControlName="archived"
                class="accent-frenchRed h-4 w-4 cursor-pointer rounded"
                />
              <span class="text-primary dark:text-primaryDark text-sm"
                >Joueur archivé</span
                >
            </label>
          </div>
        </div>

        <button
          type="button"
          (click)="updatePlayer()"
          class="bg-frenchRed mt-6 w-full cursor-pointer rounded-lg px-5 py-2.5 text-center text-sm font-medium text-white hover:opacity-90"
          >
          Mettre à jour
        </button>
      </div>
    </form>
  }
</section>

<app-feedback-modal
  [open]="feedbackOpen"
  [type]="feedbackType"
  [title]="feedbackTitle"
  [message]="feedbackMessage"
  (closed)="closeFeedback()"
></app-feedback-modal>
