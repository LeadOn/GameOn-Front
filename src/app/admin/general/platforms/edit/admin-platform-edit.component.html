<section id="admin-platform-edit" class="px-4 pt-4">
  @if (loading == true) {
    <app-loading-spinner></app-loading-spinner>
  }

  @if (loading == false && platform.id != 0) {
    <div class="mb-4">
      <h1 class="text-primary dark:text-primaryDark text-xl font-bold">
        Plateforme {{ platform.name }}
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Modifier le nom de la plateforme.
      </p>
    </div>

    <form
      [formGroup]="updatePlatformForm"
      class="flex flex-col items-center"
      >
      <div
        class="bg-bgLight dark:bg-bgDark w-full max-w-xl rounded-2xl p-6 shadow-sm"
        >
        <div class="flex flex-col gap-1">
          <label
            for="name"
            class="text-xs font-medium text-gray-500 dark:text-gray-400"
            >Nom <span class="text-customRed">*</span></label
            >
          <input
            type="text"
            id="name"
            formControlName="name"
            maxlength="50"
            class="bg-bgLightDarker dark:bg-bgDarkDarker text-primary dark:text-primaryDark focus:ring-secondary rounded-lg border-0 px-3 py-2 text-sm focus:ring-2"
            />
        </div>

        <button
          type="button"
          (click)="updatePlatform()"
          class="bg-frenchRed mt-6 w-full cursor-pointer rounded-lg px-5 py-2.5 text-center text-sm font-medium text-white hover:opacity-90"
          >
          Mettre à jour
        </button>
      </div>
    </form>
  }
</section>

<app-feedback-modal
  [open]="feedbackOpen"
  [type]="feedbackType"
  [title]="feedbackTitle"
  [message]="feedbackMessage"
  (closed)="closeFeedback()"
></app-feedback-modal>
