<!doctype html>
<html lang="fr" class="dark scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <script>
      // Applies the persisted theme before first paint to avoid a flash of
      // the wrong theme (Angular bootstrap/ThemeService run too late for this).
      (function () {
        try {
          var theme = localStorage.getItem('gameon-theme');
          document.documentElement.classList.toggle('dark', theme !== 'light');
        } catch (e) {}
      })();
    </script>
    <title>GameOn!</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Site de statistiques cross-plateforme, et cross-jeux."
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="assets/favicon/site.webmanifest" />
    <link
      rel="mask-icon"
      href="assets/favicon/safari-pinned-tab.svg"
      color="#283957"
    />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#0c101d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Space+Grotesk:wght@500..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
