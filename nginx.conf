events{}

http {

    include /etc/nginx/mime.types;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # nginx's mime.types has no mapping for .webmanifest, so without this
        # the PWA manifest is served as text/plain (default_type).
        location = /assets/favicon/site.webmanifest {
            default_type application/manifest+json;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}