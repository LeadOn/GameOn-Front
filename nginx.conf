events{}

http {

    include /etc/nginx/mime.types;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # nginx's mime.types has no mapping for .webmanifest, so without this
        # the PWA manifest is served as text/plain (default_type).
        location = /assets/favicon/site.webmanifest {
            default_type application/manifest+json;
        }

        # The service worker and its manifest must never be served from an
        # HTTP cache, otherwise clients keep booting the old build forever.
        location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}